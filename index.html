<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iris Gaze Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --muted: #888;
    --blue: #4a9eff;
    --green: #3ecf8e;
    --pink: #f06292;
    --amber: #ffb74d;
    --font: 'DM Mono', 'Courier New', monospace;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap');

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .logo {
    font-family: var(--font);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .logo span { color: var(--blue); }

  .status-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    background: var(--surface);
    font-family: var(--font);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.3s;
  }
  .status-pill.active { border-color: var(--green); color: var(--green); }
  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .status-pill.active .dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .main { display: grid; grid-template-columns: 1fr 300px; gap: 20px; width: 100%; max-width: 960px; }
  @media (max-width: 700px) { .main { grid-template-columns: 1fr; } }

  .video-block {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    aspect-ratio: 4/3;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
  }
  #canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
  }

  .gaze-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 16px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .gaze-big {
    font-family: var(--font);
    font-size: 28px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.04em;
    transition: color 0.15s;
  }
  .gaze-big.left { color: var(--blue); }
  .gaze-big.right { color: var(--pink); }
  .gaze-big.center { color: var(--green); }

  .ratio-mini {
    display: flex; align-items: center; gap: 8px;
  }
  .ratio-track {
    width: 80px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .ratio-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 2px;
    transition: width 0.08s;
  }
  .ratio-num {
    font-family: var(--font);
    font-size: 11px;
    color: var(--muted);
    min-width: 28px;
  }

  .panel { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-label {
    font-family: var(--font);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .caliper-item { margin-bottom: 14px; }
  .caliper-item:last-child { margin-bottom: 0; }
  .ci-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .ci-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .ci-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--blue); transition: all 0.2s; }
  .ci-dot.right-eye { border-color: var(--pink); }
  .ci-dot.detected { background: currentColor; opacity: 0.4; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%; height: 4px;
    border-radius: 2px;
    background: var(--surface2);
    outline: none;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--blue);
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(1.3); }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-val {
    font-family: var(--font);
    font-size: 12px;
    color: var(--blue);
    min-width: 36px;
    text-align: right;
  }

  .gaze-card {
    text-align: center;
    padding: 20px 12px;
  }
  .gaze-icon {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 10px;
    transition: all 0.15s;
    display: block;
    min-height: 56px;
  }
  .gaze-word {
    font-family: var(--font);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.15s;
  }
  .gaze-word.left { color: var(--blue); }
  .gaze-word.right { color: var(--pink); }
  .gaze-word.center { color: var(--green); }
  .gaze-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .bar-full { margin-top: 14px; }
  .bar-bg {
    height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fg { height: 100%; background: var(--blue); transition: width 0.1s; border-radius: 3px; }
  .bar-labels {
    display: flex; justify-content: space-between;
    font-family: var(--font);
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.06em;
  }

  .btn {
    width: 100%; padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--surface2); border-color: var(--blue); color: var(--blue); }
  .btn.active { background: var(--blue); border-color: var(--blue); color: #000; }
  .btn.stop { border-color: var(--pink); }
  .btn.stop:hover { background: var(--pink); color: #000; }

  .mp-status {
    font-family: var(--font);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.06em;
  }
  .mp-status.ok { color: var(--green); }

  #noFaceMsg {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font);
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
    text-align: center;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>IRIS</span>.GAZE — tracker</div>
  <div class="status-pill" id="statusPill">
    <span class="dot"></span>
    <span id="statusTxt">inactif</span>
  </div>
</header>

<div class="main">
  <div class="video-block">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="noFaceMsg">aucun visage détecté</div>
    <div class="gaze-overlay">
      <div class="gaze-big" id="gazeBig">—</div>
      <div class="ratio-mini">
        <div class="ratio-track"><div class="ratio-fill" id="ratioFill" style="width:50%"></div></div>
        <div class="ratio-num" id="ratioNum">—</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="card gaze-card">
      <span class="gaze-icon" id="gazeIcon">👁</span>
      <div class="gaze-word" id="gazeWord">ATTENTE</div>
      <div class="gaze-hint" id="gazeHint">démarrer la caméra</div>
      <div class="bar-full">
        <div class="bar-bg"><div class="bar-fg" id="barFg" style="width:50%"></div></div>
        <div class="bar-labels"><span>← GAUCHE</span><span>DROITE →</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Calipers iris</div>
      <div class="caliper-item">
        <div class="ci-head">
          <span class="ci-name">OG — Œil Gauche</span>
          <div class="ci-dot" id="dotOG" style="border-color:var(--blue)"></div>
        </div>
        <div class="range-row">
          <input type="range" id="sOG" min="4" max="22" value="10" step="1">
          <span class="range-val" id="vOG" style="color:var(--blue)">10</span>
        </div>
      </div>
      <div class="caliper-item">
        <div class="ci-head">
          <span class="ci-name">OD — Œil Droit</span>
          <div class="ci-dot right-eye" id="dotOD" style="border-color:var(--pink)"></div>
        </div>
        <div class="range-row">
          <input type="range" id="sOD" min="4" max="22" value="10" step="1">
          <span class="range-val" id="vOD" style="color:var(--pink)">10</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Seuil de détection</div>
      <div class="range-row">
        <input type="range" id="sSeuil" min="0.01" max="0.15" value="0.05" step="0.01">
        <span class="range-val" id="vSeuil">0.05</span>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;font-family:var(--font);letter-spacing:0.04em">
        bas = très sensible · haut = tolérant
      </div>
    </div>

    <button class="btn active" id="startBtn">▶ démarrer caméra</button>
    <button class="btn stop" id="stopBtn" style="display:none">⏹ arrêter</button>
    <div class="mp-status" id="mpStatus">mediapipe non chargé</div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusPill = document.getElementById('statusPill');
const statusTxt = document.getElementById('statusTxt');
const mpStatus = document.getElementById('mpStatus');
const gazeBig = document.getElementById('gazeBig');
const gazeIcon = document.getElementById('gazeIcon');
const gazeWord = document.getElementById('gazeWord');
const gazeHint = document.getElementById('gazeHint');
const ratioFill = document.getElementById('ratioFill');
const ratioNum = document.getElementById('ratioNum');
const barFg = document.getElementById('barFg');
const noFaceMsg = document.getElementById('noFaceMsg');
const dotOG = document.getElementById('dotOG');
const dotOD = document.getElementById('dotOD');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let diamOG = 10, diamOD = 10, seuil = 0.05;
let cameraObj = null, faceMeshObj = null, running = false;
let smooth = 0.5;

document.getElementById('sOG').addEventListener('input', e => { diamOG = +e.target.value; document.getElementById('vOG').textContent = diamOG; });
document.getElementById('sOD').addEventListener('input', e => { diamOD = +e.target.value; document.getElementById('vOD').textContent = diamOD; });
document.getElementById('sSeuil').addEventListener('input', e => { seuil = +e.target.value; document.getElementById('vSeuil').textContent = (+e.target.value).toFixed(2); });

const IRIS_L = [474,475,476,477];
const IRIS_R = [469,470,471,472];
const EL_OUT = 263, EL_IN = 362;
const ER_OUT = 33,  ER_IN = 133;

function center(lms, idx, w, h) {
  let x=0,y=0; idx.forEach(i=>{x+=lms[i].x;y+=lms[i].y;});
  return {x:x/idx.length*w, y:y/idx.length*h};
}
function pt(lms,i,w,h){return{x:lms[i].x*w,y:lms[i].y*h};}

function ratio(lms,irisIdx,out,inn,w,h){
  const c=center(lms,irisIdx,w,h);
  const o=pt(lms,out,w,h),i=pt(lms,inn,w,h);
  const ew=Math.abs(o.x-i.x);
  if(ew<1)return 0.5;
  return(c.x-Math.min(o.x,i.x))/ew;
}

function caliper(cx,cy,r,color){
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-r-5,cy);ctx.lineTo(cx+r+5,cy);
  ctx.moveTo(cx,cy-r-5);ctx.lineTo(cx,cy+r+5);
  ctx.strokeStyle=color+'66';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,2,0,Math.PI*2);
  ctx.fillStyle=color;ctx.fill();
}

function onResults(res){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  if(!res.multiFaceLandmarks||!res.multiFaceLandmarks.length){
    dotOG.classList.remove('detected'); dotOD.classList.remove('detected');
    noFaceMsg.style.display='block';
    setDir('none'); return;
  }
  noFaceMsg.style.display='none';
  const lms=res.multiFaceLandmarks[0];
  dotOG.classList.add('detected'); dotOD.classList.add('detected');

  const cL=center(lms,IRIS_L,w,h);
  const cR=center(lms,IRIS_R,w,h);
  caliper(cL.x,cL.y,diamOG/2,'#4a9eff');
  caliper(cR.x,cR.y,diamOD/2,'#f06292');

  const rL=ratio(lms,IRIS_L,EL_OUT,EL_IN,w,h);
  const rR=ratio(lms,IRIS_R,ER_OUT,ER_IN,w,h);
  const avg=(rL+rR)/2;
  smooth=smooth*0.75+avg*0.25;

  const pct=Math.round(smooth*100);
  const barW=Math.max(5,Math.min(95,pct));
  ratioFill.style.width=barW+'%';
  barFg.style.width=barW+'%';
  ratioNum.textContent=pct+'%';

  if(smooth<0.5-seuil) setDir('right');
  else if(smooth>0.5+seuil) setDir('left');
  else setDir('center');
}

function setDir(d){
  const map={
    left:  {big:'← gauche',icon:'←',word:'GAUCHE',hint:'regard vers la gauche',cls:'left'},
    right: {big:'droite →',icon:'→',word:'DROITE',hint:'regard vers la droite',cls:'right'},
    center:{big:'· centre ·',icon:'·',word:'CENTRE',hint:'regard centré',cls:'center'},
    none:  {big:'—',icon:'👁',word:'ATTENTE',hint:'aucun visage',cls:''},
  };
  const m=map[d]||map.none;
  gazeBig.textContent=m.big;
  gazeBig.className='gaze-big '+m.cls;
  gazeIcon.textContent=m.icon;
  gazeWord.textContent=m.word;
  gazeWord.className='gaze-word '+m.cls;
  gazeHint.textContent=m.hint;
}

async function start(){
  if(running)return;
  startBtn.style.display='none'; stopBtn.style.display='';
  statusTxt.textContent='chargement…'; mpStatus.textContent='initialisation mediapipe…';

  faceMeshObj=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
  faceMeshObj.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  faceMeshObj.onResults(res=>{
    canvas.width=video.videoWidth||640;
    canvas.height=video.videoHeight||480;
    onResults(res);
  });
  await faceMeshObj.initialize();
  mpStatus.textContent='mediapipe actif ✓'; mpStatus.className='mp-status ok';

  cameraObj=new Camera(video,{
    onFrame:async()=>{if(faceMeshObj)await faceMeshObj.send({image:video});},
    width:640,height:480
  });
  await cameraObj.start();
  running=true;
  statusPill.classList.add('active');
  statusTxt.textContent='actif';
  noFaceMsg.style.display='block';
}

function stop(){
  if(cameraObj){cameraObj.stop();cameraObj=null;}
  if(faceMeshObj){faceMeshObj.close();faceMeshObj=null;}
  running=false;
  startBtn.style.display=''; stopBtn.style.display='none';
  statusPill.classList.remove('active'); statusTxt.textContent='inactif';
  mpStatus.textContent='mediapipe non chargé'; mpStatus.className='mp-status';
  ctx.clearRect(0,0,canvas.width,canvas.height);
  dotOG.classList.remove('detected'); dotOD.classList.remove('detected');
  noFaceMsg.style.display='none';
  setDir('none'); ratioFill.style.width='50%'; barFg.style.width='50%'; ratioNum.textContent='—';
}

startBtn.addEventListener('click',start);
stopBtn.addEventListener('click',stop);
</script>
</body>
</html>
