<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mira</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--ink:#111;--muted:#aaa;--accent:#111;}
 
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;}
body{display:flex;align-items:center;justify-content:center;}
 
/* ── SCREENS ── */
.screen{display:none;position:fixed;inset:0;overflow:hidden;
  flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}
 
/* ══ ÉCRAN 1 : CALIBRATION ══ */
#sCalib{gap:clamp(16px,3vh,36px);padding:clamp(20px,4vw,60px);}
.calib-title{font-size:clamp(36px,8vw,80px);font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);}
.calib-step{font-size:clamp(10px,1.4vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:-6px;}
.calib-body{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:460px;}
.calib-instruction{font-size:clamp(11px,1.5vw,13px);color:var(--muted);text-align:center;line-height:1.6;}
.cal-ruler-row{display:flex;align-items:center;gap:12px;width:100%;}
.cal-ruler{
  height:clamp(24px,3.5vh,36px);background:#111;border-radius:4px;
  cursor:ew-resize;position:relative;flex-shrink:0;touch-action:none;
  display:flex;align-items:center;justify-content:center;min-width:60px;
}
.cal-ruler::after{
  content:'';position:absolute;inset:0;border-radius:4px;
  background:repeating-linear-gradient(90deg,
    transparent 0,transparent 9px,rgba(255,255,255,.25) 9px,rgba(255,255,255,.25) 10px);
}
.cal-ruler-txt{position:absolute;color:#fff;font-size:clamp(9px,1.2vw,11px);
  letter-spacing:.08em;z-index:1;pointer-events:none;white-space:nowrap;}
.cal-px-val{font-size:11px;color:#ccc;min-width:44px;flex-shrink:0;text-align:right;}
.cal-ok-badge{
  font-size:10px;color:#22cc66;letter-spacing:.1em;text-transform:uppercase;
  display:none;padding:4px 10px;border:1px solid #22cc6644;border-radius:20px;
}
.btn-validate{
  background:var(--ink);color:#fff;border:none;border-radius:6px;
  padding:clamp(10px,1.8vh,15px) clamp(28px,5vw,48px);
  font-size:clamp(11px,1.5vw,14px);letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;
}
.btn-validate:hover{opacity:.75;}
 
/* ══ ÉCRAN 2 : CHOIX DE MODE ══ */
#sMode{gap:clamp(20px,4vh,48px);padding:clamp(20px,4vw,60px);}
.mode-title{font-size:clamp(36px,8vw,80px);font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);}
.mode-step{font-size:clamp(10px,1.4vw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:-6px;}
.mode-btns{display:flex;gap:clamp(10px,2vw,20px);flex-wrap:wrap;justify-content:center;}
.btn-mode{
  background:none;border:1.5px solid var(--ink);border-radius:8px;
  padding:clamp(14px,2.5vh,22px) clamp(24px,4vw,44px);
  font-size:clamp(12px,1.6vw,15px);letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;color:var(--ink);transition:background .15s,color .15s;
  white-space:nowrap;
}
.btn-mode:hover{background:var(--ink);color:#fff;}
.btn-mode.loading{opacity:.5;cursor:wait;}
.btn-recalib{
  background:none;border:none;font-size:clamp(9px,1.1vw,11px);
  letter-spacing:.12em;text-transform:uppercase;color:#ccc;cursor:pointer;
  padding:4px 8px;transition:color .15s;
}
.btn-recalib:hover{color:var(--ink);}
 
/* ══ TEST ══ */
#sTest{padding:0;position:relative;}
.test-arena{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;}
.progress-bar{position:fixed;top:0;left:0;right:0;height:2px;background:#eee;z-index:20;}
.progress-fill{height:100%;background:var(--ink);transition:width .1s linear;}
.timer-hint{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#ddd;z-index:20;font-variant-numeric:tabular-nums;}
.size-label{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ddd;z-index:20;white-space:nowrap;}
.dist-label{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#ccc;z-index:20;white-space:nowrap;}
.ball-container{position:absolute;display:flex;align-items:center;justify-content:center;}
.ball-canvas{display:block;flex-shrink:0;}
.ball-canvas.gazing{filter:drop-shadow(0 0 10px rgba(17,17,17,.3));}
.cam-mini{position:fixed;bottom:8px;right:8px;width:88px;height:66px;
  border-radius:5px;overflow:hidden;border:1px solid #eee;background:#000;z-index:30;}
#videoMini{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
#canvasMini{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none;}
 
/* ══ PAUSE OVERLAY ══ */
#pauseOverlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(255,255,255,.96);
  flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3vh,32px);
}
#pauseOverlay.visible{display:flex;}
.pause-title{font-size:clamp(28px,6vw,56px);font-weight:300;letter-spacing:.15em;text-transform:uppercase;}
.overlay-btns{display:flex;flex-direction:column;gap:10px;width:clamp(160px,28vw,240px);}
.btn-ov-primary{
  width:100%;background:var(--ink);color:#fff;border:none;border-radius:6px;
  padding:clamp(10px,1.8vh,14px) 0;font-size:clamp(11px,1.5vw,13px);
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:opacity .15s;
}
.btn-ov-primary:hover{opacity:.8;}
.btn-ov-secondary{
  width:100%;background:none;border:1px solid #ccc;border-radius:6px;
  padding:clamp(9px,1.6vh,13px) 0;font-size:clamp(10px,1.3vw,12px);
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--ink);transition:border-color .15s;
}
.btn-ov-secondary:hover{border-color:var(--ink);}
.btn-ov-ghost{
  width:100%;background:none;border:none;color:#bbb;
  padding:6px 0;font-size:clamp(9px,1.1vw,11px);
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:color .15s;
}
.btn-ov-ghost:hover{color:var(--ink);}
 
/* ══ RÉSULTAT MODAL ══ */
#resultModal{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(255,255,255,.97);
  flex-direction:row;align-items:center;justify-content:center;
  gap:clamp(30px,6vw,80px);padding:0 clamp(20px,5vw,60px);
}
#resultModal.visible{display:flex;}
.rm-left{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(4px,1vh,12px);flex:0 0 auto;}
.rm-right{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(6px,1.2vh,14px);flex:1 1 auto;max-width:320px;}
.rm-num{font-size:clamp(56px,11vw,110px);font-weight:300;line-height:1;letter-spacing:-.04em;}
.rm-unit{font-size:clamp(12px,1.8vw,16px);color:var(--muted);letter-spacing:.08em;}
.rm-dist-line{font-size:clamp(11px,1.5vw,14px);color:var(--ink);letter-spacing:.04em;margin-top:2px;}
.rm-dist{font-size:clamp(12px,1.6vw,15px);color:var(--ink);letter-spacing:.04em;margin-top:4px;font-weight:400;}
.rm-verdict{font-size:clamp(11px,1.4vw,13px);color:var(--muted);line-height:1.6;}
.rm-hist-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#ccc;}
.rm-h-list{display:flex;flex-direction:column;gap:3px;max-height:clamp(80px,20vh,160px);overflow-y:auto;width:100%;}
.rm-h-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:11px;color:var(--muted);}
.rm-h-item span:last-child{font-weight:500;color:var(--ink);}
 
/* ── Mobile paysage ── */
@media (max-height:520px) and (orientation:landscape){
  .calib-title,.mode-title{font-size:clamp(22px,5vh,38px);}
  .calib-step,.mode-step{margin-top:-4px;}
  #sCalib,#sMode{gap:clamp(8px,1.5vh,16px);flex-direction:row;flex-wrap:wrap;
    align-items:center;justify-content:center;padding:0 4vw;gap:4vw;}
  .calib-body{max-width:340px;gap:8px;}
  #sMode{flex-direction:row;}
  .mode-btns{flex-direction:column;gap:8px;}
  .btn-mode{padding:10px 22px;font-size:11px;}
  #resultModal{gap:4vw;padding:0 3vw;}
  .rm-num{font-size:clamp(40px,8vw,70px);}
  .rm-h-list{max-height:clamp(50px,14vh,100px);}
  .overlay-btns{width:180px;}
  .size-label{bottom:18px;font-size:9px;}
  .dist-label{bottom:4px;font-size:9px;}
  .cam-mini{width:70px;height:52px;}
}
 
/* ── Réglette pleine largeur ── */
.cal-track-wrap{width:100%;display:flex;flex-direction:column;gap:6px;}
.cal-track{
  width:100%;height:clamp(32px,5vh,48px);background:#f0f0f0;border-radius:8px;
  position:relative;
}
.cal-bar{
  position:absolute;left:0;top:0;bottom:0;
  background:#111;border-radius:8px 0 0 8px;
  min-width:40px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;pointer-events:none;
}
.cal-bar::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,
    transparent 0,transparent 9px,rgba(255,255,255,.18) 9px,rgba(255,255,255,.18) 10px);
}
.cal-ruler-txt{color:#fff;font-size:11px;letter-spacing:.08em;pointer-events:none;white-space:nowrap;position:relative;z-index:1;}
.cal-handle{
  position:absolute;top:0;bottom:0;right:0;width:32px;
  display:flex;align-items:center;justify-content:center;
  background:#333;color:#fff;font-size:18px;letter-spacing:-3px;
  border-radius:0 8px 8px 0;cursor:ew-resize;touch-action:none;
  user-select:none;border-left:2px solid rgba(255,255,255,.15);
}
.cal-track-labels{display:flex;justify-content:space-between;align-items:center;padding:0 2px;}
.cal-px-val{font-size:11px;color:#aaa;letter-spacing:.04em;}
.cal-ok-badge{
  font-size:10px;color:#22cc66;letter-spacing:.1em;text-transform:uppercase;
  display:none;padding:4px 12px;border:1px solid #22cc6644;border-radius:20px;
}
</style>
</head>
<body>
 
<!-- ══ ÉCRAN 1 : CALIBRATION ══ -->
<div class="screen active" id="sCalib">
  <div class="calib-title">Mira</div>
  <div class="calib-step">Étape 1 — Calibration de l'écran</div>
  <div class="calib-body">
    <div class="calib-instruction">
      Posez une règle sur l'écran et faites glisser la poignée<br>
      jusqu'à ce que la barre mesure exactement <strong>5 cm</strong>.
    </div>
 
    <!-- Encart pleine largeur -->
    <div class="cal-track-wrap">
      <div class="cal-track">
        <div class="cal-bar" id="calRuler">
          <span class="cal-ruler-txt" id="calRulerTxt">← 5 cm →</span>
        </div>
        <div class="cal-handle" id="calHandle">&#8942;</div>
      </div>
      <div class="cal-track-labels">
        <span style="color:#bbb;font-size:10px;letter-spacing:.06em;">0</span>
        <span class="cal-px-val" id="calValTxt">—</span>
      </div>
    </div>
 
    <div class="cal-ok-badge" id="calOk">✓ Calibration enregistrée</div>
    <button class="btn-validate" onclick="goMode()">Valider →</button>
  </div>
</div>
 
<!-- ══ ÉCRAN 2 : CHOIX DE MODE ══ -->
<div class="screen" id="sMode">
  <div class="mode-title">Mira</div>
  <div class="mode-step">Étape 2 — Choisir le mode</div>
  <div class="mode-btns">
    <button class="btn-mode" id="btnEyeTracker" onclick="startEyeTracker()">
      Eye tracker
    </button>
    <button class="btn-mode" onclick="startClickMode()">
      Mode clic
    </button>
  </div>
  <button class="btn-recalib" onclick="showScreen('sCalib')">← Recalibrer</button>
</div>
 
<!-- ══ TEST ══ -->
<div class="screen" id="sTest">
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:100%"></div></div>
  <div class="timer-hint" id="timerHint">5.0</div>
  <div class="test-arena" id="arena">
    <div class="ball-container" id="bcLeft">
      <canvas class="ball-canvas" id="bLeft"></canvas>
    </div>
    <div class="ball-container" id="bcRight">
      <canvas class="ball-canvas" id="bRight"></canvas>
    </div>
  </div>
  <div class="size-label" id="sizeLabel"></div>
  <div class="dist-label" id="distLabel"></div>
  <div id="camMiniWrap" class="cam-mini">
    <video id="videoMini" autoplay playsinline muted></video>
    <canvas id="canvasMini"></canvas>
  </div>
</div>
 
<!-- hidden inputs for code compat -->
<input type="hidden" id="pOG" value="10">
<input type="hidden" id="vOG" value="10">
<input type="hidden" id="pOD" value="10">
<input type="hidden" id="vOD" value="10">
 
<!-- ══ PAUSE OVERLAY ══ -->
<div id="pauseOverlay">
  <div class="pause-title">Pause</div>
  <div class="overlay-btns">
    <button class="btn-ov-primary" onclick="resumeTest()">▶ Continuer</button>
    <button class="btn-ov-secondary" onclick="restartFromPause()">↺ Nouveau test</button>
    <button class="btn-ov-ghost" onclick="recalibFromPause()">⚙ Recalibrer</button>
  </div>
</div>
 
<!-- ══ RÉSULTAT MODAL ══ -->
<div id="resultModal">
  <div class="rm-left">
    <div class="rm-num" id="rmNum">—</div>
    <div class="rm-unit" id="rmUnit">à 80 cm</div>
    <div class="rm-dist" id="rmDist"></div>
    <div class="rm-verdict" id="rmVerdict"></div>
  </div>
  <div class="rm-right">
    <div class="rm-hist-title">Sessions</div>
    <div class="rm-h-list" id="rmHistList"></div>
    <div class="overlay-btns" style="margin-top:10px;">
      <button class="btn-ov-primary" onclick="newTestFromModal()">↺ Nouveau test</button>
      <button class="btn-ov-secondary" onclick="exportCSV()">Export CSV</button>
      <button class="btn-ov-ghost" onclick="recalibFromModal()">⚙ Recalibrer</button>
    </div>
  </div>
</div>
 
<script>
// ── CONFIG ──
const SEUIL = 0.03;
const STEP_DURATION = 5000; // max ms per level
const HOLD_CORRECT_MS = 600; // ms of correct gaze needed to advance
// ── Landolt C — AV en dixièmes et dimensions physiques ──
// H_mm = hauteur totale C = 5 × épaisseur e = 5 × ouverture
// À 5m: AV(1/10e) = 1/(5 × H_m) → H_mm = 1000/(5 × AV_decimale)  [distance 5m normative]
// Mais on calcule pour distance libre: on stocke AV et H_mm de la table
const LANDOLT_LEVELS = [
  {av:0.3,  hmm:194.08},
  {av:0.4,  hmm:145.51},
  {av:0.5,  hmm:116.39},
  {av:0.6,  hmm:96.98},
  {av:0.8,  hmm:72.73},
  {av:1.0,  hmm:58.18},
  {av:1.3,  hmm:44.75},
  {av:1.6,  hmm:36.36},
  {av:2.0,  hmm:29.09},
  {av:2.5,  hmm:23.27},
  {av:3.2,  hmm:18.18},
  {av:4.0,  hmm:14.54},
  {av:5.0,  hmm:11.64},
  {av:6.3,  hmm:9.23},
  {av:7.0,  hmm:8.31},
  {av:8.0,  hmm:7.27},
  {av:9.0,  hmm:6.46},
  {av:10.0, hmm:5.82},
];
 
// ── PX ↔ MM : calibration physique via règle ──
// CSS 1cm ≠ 1cm physique sur mobile → on demande à l'utilisateur de calibrer
let PX_PER_CM = (()=>{
  const el=document.createElement('div');
  el.style.cssText='position:absolute;width:1cm;height:1cm;visibility:hidden;';
  document.body.appendChild(el);
  const px=el.offsetWidth||37.8;
  document.body.removeChild(el);
  return px;
})();
// Essayer de récupérer une calibration sauvegardée
try {
  const saved = localStorage.getItem('pxPerCm');
  if(saved && parseFloat(saved)>10) PX_PER_CM = parseFloat(saved);
} catch(e){}
let PX_PER_MM = PX_PER_CM/10;
 
function mmToPx(mm){ return Math.round(mm * PX_PER_MM); }
function avLabel(av){ return av % 1 === 0 ? av.toFixed(0) : av.toString().replace('.',','); }
 
function applyCalibration(rulerPx){
  // rulerPx = nb pixels CSS pour 5cm mesurés sur la règle à l'écran
  PX_PER_CM = rulerPx / 5;
  PX_PER_MM = PX_PER_CM / 10;
  try { localStorage.setItem('pxPerCm', PX_PER_CM); } catch(e){}
}
// side sequence: first always centered (both), then random L/R per step
// We place spin ball on a random side each step
 
// ── STATE ──
let diamOG=10, diamOD=10;
let faceMeshObj=null, cameraObj=null, camReady=false;
let smoothH=0.5, gazeDir='none';
let estimatedDistCm=80; // distance estimée en cm (défaut 80cm)
const IPD_REF_MM=63;    // écart inter-pupillaire adulte moyen
let testRunning=false;
let testFinished=false; // guard contre double appel finishTest
let testPaused=false;
let pauseStart=0;        // timestamp quand pause démarre (pour corriger stepStartTime)
let stepIndex=0;        // current BALL_SIZES index
let spinSide='left';    // current step's spin side
let stepStartTime=0;
let correctHoldStart=null; // timestamp when correct gaze began
let lastGoodSize=LANDOLT_LEVELS[0];
let rafId=null;
let history=JSON.parse(localStorage.getItem('gazeHist2')||'[]');
 
// ── MODE : camera ou click ──
let clickMode = false;
 
// ── NAVIGATION ENTRE ÉCRANS ──
function goMode(){
  renderHistory();
  showScreen('sMode');
}
 
function recalibFromPause(){
  document.getElementById('pauseOverlay').classList.remove('visible');
  testRunning=false; testFinished=true; testPaused=false;
  cancelAnimationFrame(rafId);
  showScreen('sCalib');
}
 
function recalibFromModal(){
  document.getElementById('resultModal').classList.remove('visible');
  showScreen('sCalib');
}
 
// ── CAMERA ──
async function initCamInternal(){
  const video=document.getElementById('videoMini');
  const canvas=document.getElementById('canvasMini');
  const ctx2=canvas.getContext('2d');
  faceMeshObj=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
  faceMeshObj.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  faceMeshObj.onResults(res=>{
    canvas.width=video.videoWidth||320;
    canvas.height=video.videoHeight||240;
    ctx2.clearRect(0,0,canvas.width,canvas.height);
    processIris(res,ctx2,canvas.width,canvas.height);
  });
  await faceMeshObj.initialize();
  cameraObj=new Camera(video,{
    onFrame:async()=>{if(faceMeshObj)await faceMeshObj.send({image:video});},
    width:320,height:240
  });
  await cameraObj.start();
}
 
async function startEyeTracker(){
  const btn=document.getElementById('btnEyeTracker');
  btn.classList.add('loading');
  btn.textContent='Initialisation…';
  try {
    if(!camReady){
      await initCamInternal();
      camReady=true;
    }
    document.getElementById('camMiniWrap').style.display='block';
    clickMode=false;
    btn.classList.remove('loading');
    btn.textContent='Eye tracker';
    startTest();
  } catch(err){
    btn.classList.remove('loading');
    btn.textContent='Eye tracker (indisponible)';
    btn.style.opacity='.4';
    btn.style.cursor='not-allowed';
  }
}
 
function startClickMode(){
  clickMode=true;
  camReady=true;
  document.getElementById('camMiniWrap').style.display='none';
  startTest();
}
 
// ── IRIS + TÊTE PROCESSING ──
const IRIS_L=[474,475,476,477],IRIS_R=[469,470,471,472];
const EL_OUT=263,EL_IN=362,ER_OUT=33,ER_IN=133;
// Landmarks pour rotation de tête (yaw)
// 454=tragus droit, 234=tragus gauche, 1=bout du nez
// En image miroir (scaleX(-1)), D et G sont inversés → on utilise la position relative du nez
const NOSE_TIP=1, CHEEK_R=454, CHEEK_L=234;
const HEAD_YAW_SEUIL=0.04; // seuil rotation tête (en fraction de largeur visage)
 
let smoothHead=0; // -1=gauche, 0=centre, +1=droite (normalisé)
let headDir='none';
 
function cOf(lms,idx,w,h){let x=0,y=0;idx.forEach(i=>{x+=lms[i].x;y+=lms[i].y;});return{x:x/idx.length*w,y:y/idx.length*h};}
function pOf(lms,i,w,h){return{x:lms[i].x*w,y:lms[i].y*h};}
function hRatio(lms,iris,out,inn,w,h){
  const c=cOf(lms,iris,w,h),o=pOf(lms,out,w,h),i=pOf(lms,inn,w,h);
  const ew=Math.abs(o.x-i.x);if(ew<1)return 0.5;
  return(c.x-Math.min(o.x,i.x))/ew;
}
function drawCal(ctx,cx,cy,r,col){
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-r-3,cy);ctx.lineTo(cx+r+3,cy);ctx.moveTo(cx,cy-r-3);ctx.lineTo(cx,cy+r+3);
  ctx.strokeStyle=col+'55';ctx.lineWidth=1;ctx.stroke();
}
 
function processIris(res,ctx,w,h){
  if(!res.multiFaceLandmarks||!res.multiFaceLandmarks.length){gazeDir='none';headDir='none';return;}
  const lms=res.multiFaceLandmarks[0];
  const cL=cOf(lms,IRIS_L,w,h),cR=cOf(lms,IRIS_R,w,h);
  drawCal(ctx,cL.x,cL.y,diamOG/2,'#4af');
  drawCal(ctx,cR.x,cR.y,diamOD/2,'#f4a');
 
  // ── Distance via IPD ──
  const ipdPx=Math.abs(cL.x-cR.x);
  if(ipdPx>10){
    const rawDist=(IPD_REF_MM*(w/ipdPx)*0.070);
    estimatedDistCm=estimatedDistCm*0.9+rawDist*0.1;
  }
 
  // ── Direction du regard (iris) ──
  const avg=((hRatio(lms,IRIS_L,EL_OUT,EL_IN,w,h))+(hRatio(lms,IRIS_R,ER_OUT,ER_IN,w,h)))/2;
  smoothH=smoothH*0.75+avg*0.25;
  let irisDir='none';
  // NB: caméra miroir → ratio<0.5 = œil va vers la droite réelle
  if(smoothH<0.5-SEUIL) irisDir='right';
  else if(smoothH>0.5+SEUIL) irisDir='left';
 
  // ── Rotation de tête (yaw) via asymétrie joues/nez ──
  // On mesure (nez - milieu des deux joues) normalisé par largeur du visage
  const nose=pOf(lms,NOSE_TIP,w,h);
  const cheekR=pOf(lms,CHEEK_R,w,h);
  const cheekL=pOf(lms,CHEEK_L,w,h);
  const faceW=Math.abs(cheekR.x-cheekL.x);
  if(faceW>10){
    const midX=(cheekR.x+cheekL.x)/2;
    const rawYaw=(nose.x-midX)/faceW; // >0 = nez à droite image = tête tournée gauche réelle (miroir)
    smoothHead=smoothHead*0.75+rawYaw*0.25;
  }
  // miroir : nez décalé à droite dans image = tête vers gauche réelle
  if(smoothHead>HEAD_YAW_SEUIL) headDir='left';
  else if(smoothHead<-HEAD_YAW_SEUIL) headDir='right';
  else headDir='none';
 
  // ── Direction combinée : iris OU tête suffisent ──
  if(irisDir!=='none') gazeDir=irisDir;
  else if(headDir!=='none') gazeDir=headDir;
  else gazeDir='none';
}
 
// ── TEST ──
function startTest(){
  const maxSzPx=Math.min(window.innerWidth*0.38, window.innerHeight*0.85);
  stepIndex=0;
  for(let i=0;i<LANDOLT_LEVELS.length;i++){
    if(mmToPx(LANDOLT_LEVELS[i].hmm)<=maxSzPx){ stepIndex=i; break; }
    stepIndex=i;
  }
  correctHoldStart=null;
  testFinished=false;
  testRunning=true;
  lastGoodSize=LANDOLT_LEVELS[stepIndex];
  lastRafTs=null;
  spinAngle=0;
  cancelAnimationFrame(rafId);
  showScreen('sTest');
  // Gestion des clics sur l'arena
  const arena=document.getElementById('arena');
  if(clickMode){
    // Mode clic : clic sur le cercle tournant = valider le niveau
    // Double-tap (2 clics rapides) = pause
    let lastClickTime=0;
    let pendingPause=null;
    arena.onclick=(e)=>{
      if(!testRunning||testFinished) return;
      const now=Date.now();
      const dt=now-lastClickTime;
      lastClickTime=now;
      if(dt<400){
        // Double-tap → pause
        if(pendingPause) clearTimeout(pendingPause);
        pendingPause=null;
        pauseTest();
        return;
      }
      // Simple clic : vérifier si on a cliqué sur le canvas tournant
      pendingPause=setTimeout(()=>{
        pendingPause=null;
        const spinId=spinSide==='left'?'bLeft':'bRight';
        const spinCanvas=document.getElementById(spinId);
        const rect=spinCanvas.getBoundingClientRect();
        const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
        const dist=Math.hypot(e.clientX-cx, e.clientY-cy);
        if(dist<=rect.width/2){
          // Clic sur le bon cercle → validation immédiate
          gazeDir=spinSide;
          correctHoldStart=Date.now()-HOLD_CORRECT_MS; // forcer succès au prochain frame
        }
      }, 200);
    };
  } else {
    // Mode caméra : simple tap = pause
    arena.onclick=()=>pauseTest();
  }
  setupStep();
  rafId=requestAnimationFrame(masterLoop);
}
 
function pauseTest(){
  if(!testRunning||testFinished) return;
  testRunning=false;
  testPaused=true;
  pauseStart=Date.now();
  cancelAnimationFrame(rafId);
  // Figer la barre de progression
  const fill=document.getElementById('progFill');
  const w=fill.getBoundingClientRect().width/fill.parentElement.getBoundingClientRect().width*100;
  fill.style.transition='none';
  fill.style.width=w+'%';
  document.getElementById('pauseOverlay').classList.add('visible');
}
 
function resumeTest(){
  if(!testPaused) return;
  document.getElementById('pauseOverlay').classList.remove('visible');
  // Corriger stepStartTime pour ne pas compter le temps de pause
  const pausedMs=Date.now()-pauseStart;
  stepStartTime+=pausedMs;
  testPaused=false;
  testRunning=true;
  lastRafTs=null;
  // Relancer la barre
  const elapsed=Date.now()-stepStartTime;
  const remaining=Math.max(0, STEP_DURATION-elapsed);
  const fill=document.getElementById('progFill');
  fill.style.transition='none';
  fill.style.width=(remaining/STEP_DURATION*100)+'%';
  setTimeout(()=>{
    fill.style.transition='width '+remaining+'ms linear';
    fill.style.width='0%';
  },30);
  rafId=requestAnimationFrame(masterLoop);
}
 
function restartFromPause(){
  document.getElementById('pauseOverlay').classList.remove('visible');
  testPaused=false;
  testRunning=false;
  testFinished=true;
  cancelAnimationFrame(rafId);
  showScreen('sMode');
}
 
// ── CANVAS DRAWING ──
let spinAngle=0;
const STROKE_RATIO=0.40; // Landolt C: e = H/5 = 2r/5 → sw = 0.4 × r
const SPIN_SPEED=40*2*Math.PI/(60*1000); // 40 RPM en rad/ms
let currentSpinSz=0;
let lastRafTs=null;
 
function drawRing(canvas, sz, isSpinning, angle){
  const dpr=window.devicePixelRatio||1;
  canvas.style.width=sz+'px';
  canvas.style.height=sz+'px';
  canvas.width=Math.round(sz*dpr);
  canvas.height=Math.round(sz*dpr);
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,sz,sz);
  const cx=sz/2, cy=sz/2, r=sz/2;
  const sw=Math.max(2, r*STROKE_RATIO);
  const ir=r-sw/2;
  ctx.beginPath();
  ctx.arc(cx,cy,ir,0,Math.PI*2);
  ctx.strokeStyle='#000000';
  ctx.lineWidth=sw;
  ctx.stroke();
  if(isSpinning){
    const halfSpan=sw/(2*ir);
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r+2,angle-halfSpan,angle+halfSpan);
    ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,1)';
    ctx.fill();
    ctx.restore();
  }
}
 
function updateDistLabel(level){
  const dist=Math.round(estimatedDistCm);
  // AV corrigée = AV_table × (distance_réelle / 80cm)
  const avCorr=(level.av * estimatedDistCm/80);
  // Arrondir à valeur standard la plus proche
  const avStd=[0.3,0.4,0.5,0.6,0.8,1.0,1.3,1.6,2.0,2.5,3.2,4.0,5.0,6.3,7.0,8.0,9.0,10.0];
  const avRound=avStd.reduce((a,b)=>Math.abs(b-avCorr)<Math.abs(a-avCorr)?b:a);
  document.getElementById('sizeLabel').textContent=
    'AV affichée '+avLabel(level.av)+'/10  ·  dist ~'+dist+' cm';
  document.getElementById('distLabel').textContent=
    'AV corrigée à 80 cm : '+avLabel(avRound)+'/10';
}
 
function setupStep(){
  const level=LANDOLT_LEVELS[stepIndex];
  const vw=window.innerWidth, vh=window.innerHeight;
  // Max size = 40% of screen width (half available) or 85% of screen height
  const maxSzPx=Math.min(vw*0.38, vh*0.85);
  const sz=Math.min(mmToPx(level.hmm), maxSzPx); // cap to screen
  // random side for spin ball (pure random each step)
  spinSide=Math.random()<0.5?'left':'right';
  spinAngle=0;
 
  const spinId=spinSide==='left'?'bLeft':'bRight';
  const stillId=spinSide==='left'?'bRight':'bLeft';
  const bSpin=document.getElementById(spinId);
  const bStill=document.getElementById(stillId);
 
  // position both in their half
  positionHalf('bcLeft','left',sz);
  positionHalf('bcRight','right',sz);
 
  // Draw still ring immediately
  drawRing(bStill, sz, false, 0);
  bStill.className='ball-canvas';
 
  // Spin ball: will be drawn by loop
  bSpin.width=sz; bSpin.height=sz;
  bSpin.className='ball-canvas';
 
  updateDistLabel(level);
  document.getElementById('progFill').style.transition='none';
  document.getElementById('progFill').style.width='100%';
  correctHoldStart=null;
  stepStartTime=Date.now();
 
  currentSpinSz=sz;
 
  setTimeout(()=>{
    document.getElementById('progFill').style.transition='width '+STEP_DURATION+'ms linear';
    document.getElementById('progFill').style.width='0%';
  },30);
}
 
function positionHalf(containerId, side, sz){
  const el=document.getElementById(containerId);
  const vw=window.innerWidth, vh=window.innerHeight;
  const cx=(side==='left'? vw*0.13 : vw*0.87);
  const cy=vh/2;
  el.style.position='absolute';
  el.style.left=(cx-sz/2)+'px';
  el.style.top=(cy-sz/2)+'px';
  el.style.width=sz+'px';
  el.style.height=sz+'px';
}
 
function masterLoop(ts){
  // UNIQUE point d'entrée RAF — spin + logique test
  if(!testRunning) return;
 
  // Avancer l'angle de spin
  if(lastRafTs!==null) spinAngle+=(ts-lastRafTs)*SPIN_SPEED;
  lastRafTs=ts;
 
  // Dessiner le cercle tournant
  const spinCanvas=document.getElementById(spinSide==='left'?'bLeft':'bRight');
  drawRing(spinCanvas, currentSpinSz, true, spinAngle);
 
  const now=Date.now();
  const elapsed=now-stepStartTime;
  const remaining=Math.max(0,(STEP_DURATION-elapsed)/1000);
 
  document.getElementById('timerHint').textContent=remaining.toFixed(1);
  if(stepIndex<LANDOLT_LEVELS.length){
    updateDistLabel(LANDOLT_LEVELS[stepIndex]);
  }
 
  const gazingCorrect=(gazeDir===spinSide);
  const bSpinEl=document.getElementById(spinSide==='left'?'bLeft':'bRight');
  if(gazingCorrect) bSpinEl.classList.add('gazing');
  else bSpinEl.classList.remove('gazing');
 
  if(gazingCorrect){
    if(correctHoldStart===null) correctHoldStart=now;
    const held=now-correctHoldStart;
    if(held>=HOLD_CORRECT_MS){
      lastGoodSize=LANDOLT_LEVELS[stepIndex];
      stepIndex++;
      if(stepIndex>=LANDOLT_LEVELS.length){
        finishTest(true);
        return; // STOP — plus de RAF
      }
      lastRafTs=null;
      spinAngle=0;
      if(clickMode) gazeDir='none'; // reset en mode clic après validation
      setupStep();
      rafId=requestAnimationFrame(masterLoop);
      return; // repart proprement après setupStep
    }
  } else {
    correctHoldStart=null;
  }
 
  if(elapsed>=STEP_DURATION){
    finishTest(false);
    return; // STOP — plus de RAF
  }
 
  rafId=requestAnimationFrame(masterLoop); // un seul RAF actif
}
 
function finishTest(completed){
  if(testFinished) return; // guard double appel
  testFinished=true;
  testRunning=false;
  cancelAnimationFrame(rafId); // arrête masterLoop
 
  const finalLevel=lastGoodSize; // always use lastGoodSize (updated before finishTest call)
  const levelsReached=completed?LANDOLT_LEVELS.length:stepIndex;
 
  const distAtEnd=Math.round(estimatedDistCm);
  const avCorrFinal=parseFloat((finalLevel.av*estimatedDistCm/80).toFixed(1));
  const session={
    date:new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
    av:finalLevel.av,
    avCorr:avCorrFinal,
    dist:distAtEnd,
    levels:levelsReached,
    completed
  };
  history.unshift(session);
  if(history.length>30)history=history.slice(0,30);
  localStorage.setItem('gazeHist2',JSON.stringify(history));
 
  // Remplir la modale de résultats
  // Format : "M1,3" (M = dixièmes d'AV, valeur sans /10)
  const avToM=(av)=>'M'+(av%1===0?av.toFixed(0):av.toString().replace('.',','));
  document.getElementById('rmNum').textContent=avToM(finalLevel.av);
  document.getElementById('rmUnit').textContent='à 80 cm';
  document.getElementById('rmDist').textContent=
    'Acuité corrigée '+avToM(avCorrFinal)+' à '+distAtEnd+' cm';
  let verdict='';
  if(completed) verdict='Score parfait — tous les niveaux réussis !';
  else if(levelsReached>=10) verdict='Acuité attentionnelle excellente.';
  else if(levelsReached>=7) verdict='Bonne attraction visuelle au mouvement.';
  else if(levelsReached>=4) verdict='Attraction modérée — sensible aux grands stimuli.';
  else verdict='Faible attraction détectée.';
  document.getElementById('rmVerdict').textContent=verdict;
  // Historique dans la modale
  renderHistory();
  setTimeout(()=>document.getElementById('resultModal').classList.add('visible'), 0);
}
 
// ── CALIBRATION RÈGLE DRAGGABLE ──
// Initialisé après le chargement du DOM
function initCalibration(){
  const bar=document.getElementById('calRuler');   // la barre noire
  const handle=document.getElementById('calHandle'); // la poignée
  const track=bar?bar.parentElement:null;            // le fond gris
  const valTxt=document.getElementById('calValTxt');
  const rulerTxt=document.getElementById('calRulerTxt');
  const calOk=document.getElementById('calOk');
  if(!bar||!handle||!track) return;
 
  // MAX = largeur du track (pleine largeur du conteneur)
  const getMax=()=>track.getBoundingClientRect().width || window.innerWidth-80;
  const MIN=60;
 
  let rulerPx=PX_PER_CM*5;
  rulerPx=Math.max(MIN, Math.min(getMax(), rulerPx));
 
  function updateRuler(px){
    rulerPx=Math.max(MIN, Math.min(getMax(), px));
    bar.style.width=rulerPx+'px';
    rulerTxt.textContent='← 5 cm →';
    valTxt.textContent=Math.round(rulerPx)+'px';
  }
  updateRuler(rulerPx);
 
  let dragging=false, startX=0, startW=0;
 
  function onStart(e){
    dragging=true;
    startX=e.touches?e.touches[0].clientX:e.clientX;
    startW=rulerPx;
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging)return;
    const x=e.touches?e.touches[0].clientX:e.clientX;
    updateRuler(startW+(x-startX));
    e.preventDefault();
  }
  function onEnd(){
    if(!dragging)return;
    dragging=false;
    applyCalibration(rulerPx);
    calOk.style.display='block';
    setTimeout(()=>calOk.style.display='none',2000);
  }
 
  handle.addEventListener('mousedown',onStart);
  handle.addEventListener('touchstart',onStart,{passive:false});
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',onEnd);
  window.addEventListener('touchend',onEnd);
}
 
document.addEventListener('DOMContentLoaded', initCalibration);
 
function renderHistory(){
  const list=document.getElementById('rmHistList');
  if(!list) return;
  if(!history.length){
    list.innerHTML='<div style="font-size:12px;color:#ccc;padding:6px 0">Aucune session précédente</div>';
    return;
  }
  list.innerHTML=history.slice(0,8).map(s=>`
    <div class="rm-h-item">
      <span style="color:var(--muted)">${s.date} · ${s.levels} niv.</span>
      <span style="font-weight:500">M${avLabel(s.av)}${s.avCorr?' → M'+s.avCorr+' @'+s.dist+'cm':''}</span>
    </div>
  `).join('');
}
 
function newTestFromModal(){
  document.getElementById('resultModal').classList.remove('visible');
  showScreen('sMode');
}
 
function exportCSV(){
  const rows=[['#','Date','AV (dixièmes)','Niveaux','Complété']];
  history.forEach((s,i)=>rows.push([history.length-i,s.date,s.av,s.levels,s.completed?'oui':'non']));
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='gaze_test_'+Date.now()+'.csv';
  a.click();
}
 
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
 
</script>
