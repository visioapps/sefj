<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaze Test</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
 
:root{
  --bg:#ffffff;
  --ink:#111111;
  --muted:#999;
  --ball:#111111;
  --spin-glow:rgba(17,17,17,0.12);
}
 
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
 
/* ── SCREENS ── */
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:40px 24px;}
.screen.active{display:flex;}
 
/* ── SETUP ── */
#sSetup{gap:40px;}
 
.s-title{
  font-size:clamp(14px,2vw,18px);
  font-weight:400;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--muted);
}
 
.s-params{
  display:flex;flex-direction:column;gap:24px;
  width:100%;max-width:400px;
}
.s-row{display:flex;flex-direction:column;gap:8px;}
.s-label{
  font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);
}
.range-wrap{display:flex;align-items:center;gap:12px;}
input[type=range]{
  flex:1;-webkit-appearance:none;height:2px;
  background:#ddd;border-radius:1px;outline:none;cursor:pointer;border:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--ink);cursor:pointer;
}
.r-val{font-size:13px;min-width:36px;text-align:right;color:var(--ink);}
 
.s-cam-row{display:flex;align-items:center;gap:10px;}
 
/* ── CALIBRATION RÈGLE ── */
.cal-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;}
.cal-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
.cal-ruler-row{display:flex;align-items:center;gap:10px;}
.cal-ruler{
  height:28px;background:#111;border-radius:3px;cursor:ew-resize;
  position:relative;flex-shrink:0;touch-action:none;
  display:flex;align-items:center;justify-content:center;
}
.cal-ruler::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,
    transparent 0px, transparent 9px,
    rgba(255,255,255,0.3) 9px, rgba(255,255,255,0.3) 10px
  );
  border-radius:3px;
}
.cal-ruler-txt{
  position:absolute;color:#fff;font-size:10px;
  letter-spacing:0.08em;z-index:1;pointer-events:none;
}
.cal-val{font-size:13px;color:var(--ink);min-width:40px;}
.cal-note{font-size:10px;color:#bbb;letter-spacing:0.04em;line-height:1.5;}
.cal-ok{font-size:10px;color:#22cc66;letter-spacing:0.06em;display:none;}
.cam-dot{width:7px;height:7px;border-radius:50%;background:#ddd;flex-shrink:0;}
.cam-dot.ok{background:#22cc66;animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cam-txt{font-size:12px;color:var(--muted);letter-spacing:0.06em;}
 
.btn-init{
  background:none;border:1px solid #ddd;border-radius:4px;
  padding:10px 24px;font-size:13px;letter-spacing:0.08em;
  text-transform:uppercase;cursor:pointer;color:var(--ink);
  transition:border-color .15s;
}
.btn-init:hover{border-color:var(--ink);}
.btn-init:disabled{opacity:.35;cursor:not-allowed;}
 
.btn-go{
  background:var(--ink);color:#fff;border:none;border-radius:4px;
  padding:14px 48px;font-size:14px;letter-spacing:0.12em;
  text-transform:uppercase;cursor:pointer;
  transition:opacity .15s;
}
.btn-go:hover{opacity:.8;}
.btn-go:disabled{opacity:.25;cursor:not-allowed;}
 
/* ── TEST ── */
#sTest{
  padding:0;justify-content:stretch;
  position:relative;
}
 
.test-arena{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
 
/* progress bar top */
.progress-bar{
  position:fixed;top:0;left:0;right:0;height:3px;
  background:#eee;z-index:20;
}
.progress-fill{
  height:100%;background:var(--ink);
  transition:width .1s linear;
}
 
/* timer tiny */
.timer-hint{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  color:#ccc;z-index:20;
  font-variant-numeric:tabular-nums;
}
 
/* size label */
.size-label{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  color:#ddd;z-index:20;
}
.dist-label{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
  color:#bbb;z-index:20;
  white-space:nowrap;
}
 
/* BALLS */
.ball-container{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
}
 
.ball-canvas{
  display:block;
  flex-shrink:0;
}
 
/* gaze ring on spin side */
.ball-canvas.gazing{
  filter:drop-shadow(0 0 8px rgba(17,17,17,.25));
}
 
/* cam mini */
.cam-mini{
  position:fixed;bottom:16px;right:16px;
  width:100px;height:75px;
  border-radius:6px;overflow:hidden;
  border:1px solid #eee;
  background:#000;z-index:30;
}
#videoMini{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
#canvasMini{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none;}
 
/* ── RESULTS ── */
#sResults{gap:48px;}
 
.r-score{text-align:center;}
.r-num{
  font-size:clamp(64px,12vw,120px);
  font-weight:300;
  line-height:1;
  letter-spacing:-0.04em;
  color:var(--ink);
}
.r-unit{font-size:clamp(16px,2.5vw,22px);color:var(--muted);font-weight:400;margin-top:6px;letter-spacing:0.1em;text-transform:uppercase;}
 
.r-detail{
  display:flex;flex-direction:column;gap:8px;
  text-align:center;
}
.r-line{font-size:14px;color:var(--muted);letter-spacing:0.04em;}
.r-line strong{color:var(--ink);font-weight:500;}
 
.history-wrap{width:100%;max-width:380px;}
.h-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#ccc;margin-bottom:10px;}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;}
.h-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #f0f0f0;
  font-size:13px;
}
.h-date{color:var(--muted);}
.h-score{font-weight:500;color:var(--ink);}
 
.r-actions{display:flex;gap:12px;}
.btn-again{
  background:var(--ink);color:#fff;border:none;border-radius:4px;
  padding:13px 36px;font-size:13px;letter-spacing:0.1em;
  text-transform:uppercase;cursor:pointer;transition:opacity .15s;
}
.btn-again:hover{opacity:.75;}
.btn-csv{
  background:none;border:1px solid #ddd;border-radius:4px;
  padding:13px 28px;font-size:13px;letter-spacing:0.1em;
  text-transform:uppercase;cursor:pointer;color:var(--ink);transition:border-color .15s;
}
.btn-csv:hover{border-color:var(--ink);}
 
/* ── PAUSE OVERLAY ── */
#pauseOverlay{
  display:none;
  position:fixed;inset:0;z-index:200;
  background:rgba(255,255,255,0.96);
  flex-direction:column;align-items:center;justify-content:center;
  gap:32px;
}
#pauseOverlay.visible{display:flex;}
.pause-title{
  font-size:clamp(28px,6vw,52px);font-weight:300;
  letter-spacing:0.15em;text-transform:uppercase;color:var(--ink);
}
.pause-actions{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;max-width:280px;}
.btn-resume{
  width:100%;background:var(--ink);color:#fff;border:none;border-radius:6px;
  padding:16px 0;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;
}
.btn-resume:hover{opacity:.8;}
.btn-restart{
  width:100%;background:none;border:1px solid #ccc;border-radius:6px;
  padding:14px 0;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;color:var(--ink);transition:border-color .15s;
}
.btn-restart:hover{border-color:var(--ink);}
 
/* ── RESULT MODAL ── */
#resultModal{
  display:none;
  position:fixed;inset:0;z-index:300;
  background:rgba(255,255,255,0.97);
  flex-direction:column;align-items:center;justify-content:center;
  gap:36px;padding:40px 24px;
}
#resultModal.visible{display:flex;}
.rm-score{text-align:center;}
.rm-num{
  font-size:clamp(72px,14vw,130px);font-weight:300;
  line-height:1;letter-spacing:-0.04em;color:var(--ink);
}
.rm-unit{font-size:clamp(13px,2vw,18px);color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-top:4px;}
.rm-dist{font-size:12px;color:#aaa;margin-top:6px;letter-spacing:0.06em;}
.rm-verdict{font-size:14px;color:var(--muted);letter-spacing:0.04em;text-align:center;max-width:300px;}
.rm-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;}
.btn-newtest{
  width:100%;background:var(--ink);color:#fff;border:none;border-radius:6px;
  padding:16px 0;font-size:14px;letter-spacing:0.12em;text-transform:uppercase;
  cursor:pointer;transition:opacity .15s;
}
.btn-newtest:hover{opacity:.8;}
.btn-modal-csv{
  width:100%;background:none;border:1px solid #ddd;border-radius:6px;
  padding:14px 0;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;
  cursor:pointer;color:var(--ink);transition:border-color .15s;
}
.btn-modal-csv:hover{border-color:var(--ink);}
.rm-history{width:100%;max-width:340px;}
.rm-h-title{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:#ccc;margin-bottom:8px;}
.rm-h-list{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto;}
.rm-h-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px;
}
</style>
</head>
<body>
 
<!-- ══ SETUP ══ -->
<div class="screen active" id="sSetup">
  <div class="s-title">Gaze Attention Test</div>
 
  <!-- Calibration règle -->
  <div class="cal-wrap">
    <div class="cal-label">Calibration écran — posez une règle et ajustez jusqu'à 10 cm</div>
    <div class="cal-ruler-row">
      <div class="cal-ruler" id="calRuler" style="width:200px;">
        <span class="cal-ruler-txt" id="calRulerTxt">10 cm ?</span>
      </div>
      <span class="cal-val" id="calValTxt">—</span>
    </div>
    <div class="cal-note">Glissez le bord droit de la barre pour qu'elle fasse exactement 10 cm sur votre règle physique.</div>
    <div class="cal-ok" id="calOk">✓ Calibration sauvegardée</div>
  </div>
 
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:400px;">
    <div class="s-cam-row">
      <div class="cam-dot" id="camDot"></div>
      <span class="cam-txt" id="camTxt">Caméra inactive</span>
    </div>
    <button class="btn-init" id="btnInit" onclick="initCam()">Activer la caméra</button>
    <button class="btn-go" id="btnGo" onclick="startTest()" disabled>Commencer</button>
  </div>
  <!-- hidden inputs kept for code compatibility -->
  <input type="hidden" id="pOG" value="10">
  <input type="hidden" id="vOG" value="10">
  <input type="hidden" id="pOD" value="10">
  <input type="hidden" id="vOD" value="10">
</div>
 
<!-- ══ TEST ══ -->
<div class="screen" id="sTest">
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:100%"></div></div>
  <div class="timer-hint" id="timerHint">5.0</div>
 
  <div class="test-arena" id="arena">
    <div class="ball-container" id="bcLeft">
      <canvas class="ball-canvas" id="bLeft"></canvas>
    </div>
    <div class="ball-container" id="bcRight">
      <canvas class="ball-canvas" id="bRight"></canvas>
    </div>
  </div>
 
  <div class="size-label" id="sizeLabel"></div>
  <div class="dist-label" id="distLabel"></div>
 
  <div class="cam-mini">
    <video id="videoMini" autoplay playsinline muted></video>
    <canvas id="canvasMini"></canvas>
  </div>
</div>
 
<!-- ══ RESULTS (kept for compat) ══ -->
<div class="screen" id="sResults" style="display:none!important;"></div>
 
<!-- ══ PAUSE OVERLAY ══ -->
<div id="pauseOverlay">
  <div class="pause-title">Pause</div>
  <div class="pause-actions">
    <button class="btn-resume" onclick="resumeTest()">▶ Continuer</button>
    <button class="btn-restart" onclick="restartFromPause()">↺ Nouveau test</button>
  </div>
</div>
 
<!-- ══ RESULT MODAL ══ -->
<div id="resultModal">
  <div class="rm-score">
    <div class="rm-num" id="rmNum">—</div>
    <div class="rm-unit">dixièmes d'acuité visuelle</div>
    <div class="rm-dist" id="rmDist"></div>
  </div>
  <div class="rm-verdict" id="rmVerdict"></div>
  <div class="rm-history">
    <div class="rm-h-title">Sessions précédentes</div>
    <div class="rm-h-list" id="rmHistList"></div>
  </div>
  <div class="rm-actions">
    <button class="btn-newtest" onclick="newTestFromModal()">Nouveau test</button>
    <button class="btn-modal-csv" onclick="exportCSV()">Export CSV</button>
  </div>
</div>
 
<script>
// ── CONFIG ──
const SEUIL = 0.03;
const STEP_DURATION = 5000; // max ms per level
const HOLD_CORRECT_MS = 600; // ms of correct gaze needed to advance
// ── Landolt C — AV en dixièmes et dimensions physiques ──
// H_mm = hauteur totale C = 5 × épaisseur e = 5 × ouverture
// À 5m: AV(1/10e) = 1/(5 × H_m) → H_mm = 1000/(5 × AV_decimale)  [distance 5m normative]
// Mais on calcule pour distance libre: on stocke AV et H_mm de la table
const LANDOLT_LEVELS = [
  {av:0.3,  hmm:194.08},
  {av:0.4,  hmm:145.51},
  {av:0.5,  hmm:116.39},
  {av:0.6,  hmm:96.98},
  {av:0.8,  hmm:72.73},
  {av:1.0,  hmm:58.18},
  {av:1.3,  hmm:44.75},
  {av:1.6,  hmm:36.36},
  {av:2.0,  hmm:29.09},
  {av:2.5,  hmm:23.27},
  {av:3.2,  hmm:18.18},
  {av:4.0,  hmm:14.54},
  {av:5.0,  hmm:11.64},
  {av:6.3,  hmm:9.23},
  {av:7.0,  hmm:8.31},
  {av:8.0,  hmm:7.27},
  {av:9.0,  hmm:6.46},
  {av:10.0, hmm:5.82},
];
 
// ── PX ↔ MM : calibration physique via règle ──
// CSS 1cm ≠ 1cm physique sur mobile → on demande à l'utilisateur de calibrer
let PX_PER_CM = (()=>{
  const el=document.createElement('div');
  el.style.cssText='position:absolute;width:1cm;height:1cm;visibility:hidden;';
  document.body.appendChild(el);
  const px=el.offsetWidth||37.8;
  document.body.removeChild(el);
  return px;
})();
// Essayer de récupérer une calibration sauvegardée
try {
  const saved = localStorage.getItem('pxPerCm');
  if(saved && parseFloat(saved)>10) PX_PER_CM = parseFloat(saved);
} catch(e){}
let PX_PER_MM = PX_PER_CM/10;
 
function mmToPx(mm){ return Math.round(mm * PX_PER_MM); }
function avLabel(av){ return av % 1 === 0 ? av.toFixed(0) : av.toString().replace('.',','); }
 
function applyCalibration(rulerPx){
  // rulerPx = nb pixels CSS pour 10cm mesurés sur la règle à l'écran
  PX_PER_CM = rulerPx / 10;
  PX_PER_MM = PX_PER_CM / 10;
  try { localStorage.setItem('pxPerCm', PX_PER_CM); } catch(e){}
}
// side sequence: first always centered (both), then random L/R per step
// We place spin ball on a random side each step
 
// ── STATE ──
let diamOG=10, diamOD=10;
let faceMeshObj=null, cameraObj=null, camReady=false;
let smoothH=0.5, gazeDir='none';
let estimatedDistCm=80; // distance estimée en cm (défaut 80cm)
const IPD_REF_MM=63;    // écart inter-pupillaire adulte moyen
let testRunning=false;
let testFinished=false; // guard contre double appel finishTest
let testPaused=false;
let pauseStart=0;        // timestamp quand pause démarre (pour corriger stepStartTime)
let stepIndex=0;        // current BALL_SIZES index
let spinSide='left';    // current step's spin side
let stepStartTime=0;
let correctHoldStart=null; // timestamp when correct gaze began
let lastGoodSize=LANDOLT_LEVELS[0];
let rafId=null;
let history=JSON.parse(localStorage.getItem('gazeHist2')||'[]');
 
// ── SETUP CONTROLS ──
document.getElementById('pOG').addEventListener('input',e=>{diamOG=+e.target.value;document.getElementById('vOG').textContent=diamOG;});
document.getElementById('pOD').addEventListener('input',e=>{diamOD=+e.target.value;document.getElementById('vOD').textContent=diamOD;});
 
// ── CAMERA ──
async function initCam(){
  document.getElementById('btnInit').disabled=true;
  document.getElementById('camTxt').textContent='Initialisation…';
  const video=document.getElementById('videoMini');
  const canvas=document.getElementById('canvasMini');
  const ctx2=canvas.getContext('2d');
 
  faceMeshObj=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
  faceMeshObj.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  faceMeshObj.onResults(res=>{
    canvas.width=video.videoWidth||320;
    canvas.height=video.videoHeight||240;
    ctx2.clearRect(0,0,canvas.width,canvas.height);
    processIris(res,ctx2,canvas.width,canvas.height);
  });
  await faceMeshObj.initialize();
 
  cameraObj=new Camera(video,{
    onFrame:async()=>{if(faceMeshObj)await faceMeshObj.send({image:video});},
    width:320,height:240
  });
  await cameraObj.start();
  camReady=true;
  document.getElementById('camDot').className='cam-dot ok';
  document.getElementById('camTxt').textContent='Prêt';
  // Afficher la direction en temps réel dans la mini-cam
  setInterval(()=>{
    if(!testRunning) return;
    const indicator = gazeDir==='left'?'← ' : gazeDir==='right'?' →' : '·';
    const src = headDir!=='none'&&gazeDir===headDir ? '(tête)' : gazeDir!=='none'?'(iris)':'';
    document.getElementById('camTxt'); // pas d'affichage hors test
  },100);
  document.getElementById('btnInit').style.display='none';
  document.getElementById('btnGo').disabled=false;
}
 
// ── IRIS + TÊTE PROCESSING ──
const IRIS_L=[474,475,476,477],IRIS_R=[469,470,471,472];
const EL_OUT=263,EL_IN=362,ER_OUT=33,ER_IN=133;
// Landmarks pour rotation de tête (yaw)
// 454=tragus droit, 234=tragus gauche, 1=bout du nez
// En image miroir (scaleX(-1)), D et G sont inversés → on utilise la position relative du nez
const NOSE_TIP=1, CHEEK_R=454, CHEEK_L=234;
const HEAD_YAW_SEUIL=0.04; // seuil rotation tête (en fraction de largeur visage)
 
let smoothHead=0; // -1=gauche, 0=centre, +1=droite (normalisé)
let headDir='none';
 
function cOf(lms,idx,w,h){let x=0,y=0;idx.forEach(i=>{x+=lms[i].x;y+=lms[i].y;});return{x:x/idx.length*w,y:y/idx.length*h};}
function pOf(lms,i,w,h){return{x:lms[i].x*w,y:lms[i].y*h};}
function hRatio(lms,iris,out,inn,w,h){
  const c=cOf(lms,iris,w,h),o=pOf(lms,out,w,h),i=pOf(lms,inn,w,h);
  const ew=Math.abs(o.x-i.x);if(ew<1)return 0.5;
  return(c.x-Math.min(o.x,i.x))/ew;
}
function drawCal(ctx,cx,cy,r,col){
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-r-3,cy);ctx.lineTo(cx+r+3,cy);ctx.moveTo(cx,cy-r-3);ctx.lineTo(cx,cy+r+3);
  ctx.strokeStyle=col+'55';ctx.lineWidth=1;ctx.stroke();
}
 
function processIris(res,ctx,w,h){
  if(!res.multiFaceLandmarks||!res.multiFaceLandmarks.length){gazeDir='none';headDir='none';return;}
  const lms=res.multiFaceLandmarks[0];
  const cL=cOf(lms,IRIS_L,w,h),cR=cOf(lms,IRIS_R,w,h);
  drawCal(ctx,cL.x,cL.y,diamOG/2,'#4af');
  drawCal(ctx,cR.x,cR.y,diamOD/2,'#f4a');
 
  // ── Distance via IPD ──
  const ipdPx=Math.abs(cL.x-cR.x);
  if(ipdPx>10){
    const rawDist=(IPD_REF_MM*(w/ipdPx)*0.070);
    estimatedDistCm=estimatedDistCm*0.9+rawDist*0.1;
  }
 
  // ── Direction du regard (iris) ──
  const avg=((hRatio(lms,IRIS_L,EL_OUT,EL_IN,w,h))+(hRatio(lms,IRIS_R,ER_OUT,ER_IN,w,h)))/2;
  smoothH=smoothH*0.75+avg*0.25;
  let irisDir='none';
  // NB: caméra miroir → ratio<0.5 = œil va vers la droite réelle
  if(smoothH<0.5-SEUIL) irisDir='right';
  else if(smoothH>0.5+SEUIL) irisDir='left';
 
  // ── Rotation de tête (yaw) via asymétrie joues/nez ──
  // On mesure (nez - milieu des deux joues) normalisé par largeur du visage
  const nose=pOf(lms,NOSE_TIP,w,h);
  const cheekR=pOf(lms,CHEEK_R,w,h);
  const cheekL=pOf(lms,CHEEK_L,w,h);
  const faceW=Math.abs(cheekR.x-cheekL.x);
  if(faceW>10){
    const midX=(cheekR.x+cheekL.x)/2;
    const rawYaw=(nose.x-midX)/faceW; // >0 = nez à droite image = tête tournée gauche réelle (miroir)
    smoothHead=smoothHead*0.75+rawYaw*0.25;
  }
  // miroir : nez décalé à droite dans image = tête vers gauche réelle
  if(smoothHead>HEAD_YAW_SEUIL) headDir='left';
  else if(smoothHead<-HEAD_YAW_SEUIL) headDir='right';
  else headDir='none';
 
  // ── Direction combinée : iris OU tête suffisent ──
  if(irisDir!=='none') gazeDir=irisDir;
  else if(headDir!=='none') gazeDir=headDir;
  else gazeDir='none';
}
 
// ── TEST ──
function startTest(){
  if(!camReady)return;
  const maxSzPx=Math.min(window.innerWidth*0.38, window.innerHeight*0.85);
  stepIndex=0;
  for(let i=0;i<LANDOLT_LEVELS.length;i++){
    if(mmToPx(LANDOLT_LEVELS[i].hmm)<=maxSzPx){ stepIndex=i; break; }
    stepIndex=i;
  }
  correctHoldStart=null;
  testFinished=false;
  testRunning=true;
  lastGoodSize=LANDOLT_LEVELS[stepIndex];
  lastRafTs=null;
  spinAngle=0;
  cancelAnimationFrame(rafId);
  showScreen('sTest');
  // Tap anywhere on arena = pause
  document.getElementById('arena').onclick=()=>pauseTest();
  setupStep();
  rafId=requestAnimationFrame(masterLoop);
}
 
function pauseTest(){
  if(!testRunning||testFinished) return;
  testRunning=false;
  testPaused=true;
  pauseStart=Date.now();
  cancelAnimationFrame(rafId);
  // Figer la barre de progression
  const fill=document.getElementById('progFill');
  const w=fill.getBoundingClientRect().width/fill.parentElement.getBoundingClientRect().width*100;
  fill.style.transition='none';
  fill.style.width=w+'%';
  document.getElementById('pauseOverlay').classList.add('visible');
}
 
function resumeTest(){
  if(!testPaused) return;
  document.getElementById('pauseOverlay').classList.remove('visible');
  // Corriger stepStartTime pour ne pas compter le temps de pause
  const pausedMs=Date.now()-pauseStart;
  stepStartTime+=pausedMs;
  testPaused=false;
  testRunning=true;
  lastRafTs=null;
  // Relancer la barre
  const elapsed=Date.now()-stepStartTime;
  const remaining=Math.max(0, STEP_DURATION-elapsed);
  const fill=document.getElementById('progFill');
  fill.style.transition='none';
  fill.style.width=(remaining/STEP_DURATION*100)+'%';
  setTimeout(()=>{
    fill.style.transition='width '+remaining+'ms linear';
    fill.style.width='0%';
  },30);
  rafId=requestAnimationFrame(masterLoop);
}
 
function restartFromPause(){
  document.getElementById('pauseOverlay').classList.remove('visible');
  testPaused=false;
  testRunning=false;
  startTest();
}
 
// ── CANVAS DRAWING ──
let spinAngle=0;
const STROKE_RATIO=0.40; // Landolt C: e = H/5 = 2r/5 → sw = 0.4 × r
const SPIN_SPEED=40*2*Math.PI/(60*1000); // 40 RPM en rad/ms
let currentSpinSz=0;
let lastRafTs=null;
 
function drawRing(canvas, sz, isSpinning, angle){
  const dpr=window.devicePixelRatio||1;
  canvas.style.width=sz+'px';
  canvas.style.height=sz+'px';
  canvas.width=Math.round(sz*dpr);
  canvas.height=Math.round(sz*dpr);
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,sz,sz);
  const cx=sz/2, cy=sz/2, r=sz/2;
  const sw=Math.max(2, r*STROKE_RATIO);
  const ir=r-sw/2;
  ctx.beginPath();
  ctx.arc(cx,cy,ir,0,Math.PI*2);
  ctx.strokeStyle='#000000';
  ctx.lineWidth=sw;
  ctx.stroke();
  if(isSpinning){
    const halfSpan=sw/(2*ir);
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r+2,angle-halfSpan,angle+halfSpan);
    ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,1)';
    ctx.fill();
    ctx.restore();
  }
}
 
function updateDistLabel(level){
  const dist=Math.round(estimatedDistCm);
  // AV corrigée = AV_table × (distance_réelle / 80cm)
  const avCorr=(level.av * estimatedDistCm/80);
  // Arrondir à valeur standard la plus proche
  const avStd=[0.3,0.4,0.5,0.6,0.8,1.0,1.3,1.6,2.0,2.5,3.2,4.0,5.0,6.3,7.0,8.0,9.0,10.0];
  const avRound=avStd.reduce((a,b)=>Math.abs(b-avCorr)<Math.abs(a-avCorr)?b:a);
  document.getElementById('sizeLabel').textContent=
    'AV affichée '+avLabel(level.av)+'/10  ·  dist ~'+dist+' cm';
  document.getElementById('distLabel').textContent=
    'AV corrigée à 80 cm : '+avLabel(avRound)+'/10';
}
 
function setupStep(){
  const level=LANDOLT_LEVELS[stepIndex];
  const vw=window.innerWidth, vh=window.innerHeight;
  // Max size = 40% of screen width (half available) or 85% of screen height
  const maxSzPx=Math.min(vw*0.38, vh*0.85);
  const sz=Math.min(mmToPx(level.hmm), maxSzPx); // cap to screen
  // random side for spin ball (pure random each step)
  spinSide=Math.random()<0.5?'left':'right';
  spinAngle=0;
 
  const spinId=spinSide==='left'?'bLeft':'bRight';
  const stillId=spinSide==='left'?'bRight':'bLeft';
  const bSpin=document.getElementById(spinId);
  const bStill=document.getElementById(stillId);
 
  // position both in their half
  positionHalf('bcLeft','left',sz);
  positionHalf('bcRight','right',sz);
 
  // Draw still ring immediately
  drawRing(bStill, sz, false, 0);
  bStill.className='ball-canvas';
 
  // Spin ball: will be drawn by loop
  bSpin.width=sz; bSpin.height=sz;
  bSpin.className='ball-canvas';
 
  updateDistLabel(level);
  document.getElementById('progFill').style.transition='none';
  document.getElementById('progFill').style.width='100%';
  correctHoldStart=null;
  stepStartTime=Date.now();
 
  currentSpinSz=sz;
 
  setTimeout(()=>{
    document.getElementById('progFill').style.transition='width '+STEP_DURATION+'ms linear';
    document.getElementById('progFill').style.width='0%';
  },30);
}
 
function positionHalf(containerId, side, sz){
  const el=document.getElementById(containerId);
  const vw=window.innerWidth, vh=window.innerHeight;
  const cx=(side==='left'? vw*0.13 : vw*0.87);
  const cy=vh/2;
  el.style.position='absolute';
  el.style.left=(cx-sz/2)+'px';
  el.style.top=(cy-sz/2)+'px';
  el.style.width=sz+'px';
  el.style.height=sz+'px';
}
 
function masterLoop(ts){
  // UNIQUE point d'entrée RAF — spin + logique test
  if(!testRunning) return;
 
  // Avancer l'angle de spin
  if(lastRafTs!==null) spinAngle+=(ts-lastRafTs)*SPIN_SPEED;
  lastRafTs=ts;
 
  // Dessiner le cercle tournant
  const spinCanvas=document.getElementById(spinSide==='left'?'bLeft':'bRight');
  drawRing(spinCanvas, currentSpinSz, true, spinAngle);
 
  const now=Date.now();
  const elapsed=now-stepStartTime;
  const remaining=Math.max(0,(STEP_DURATION-elapsed)/1000);
 
  document.getElementById('timerHint').textContent=remaining.toFixed(1);
  if(stepIndex<LANDOLT_LEVELS.length){
    updateDistLabel(LANDOLT_LEVELS[stepIndex]);
  }
 
  const gazingCorrect=(gazeDir===spinSide);
  const bSpinEl=document.getElementById(spinSide==='left'?'bLeft':'bRight');
  if(gazingCorrect) bSpinEl.classList.add('gazing');
  else bSpinEl.classList.remove('gazing');
 
  if(gazingCorrect){
    if(correctHoldStart===null) correctHoldStart=now;
    const held=now-correctHoldStart;
    if(held>=HOLD_CORRECT_MS){
      lastGoodSize=LANDOLT_LEVELS[stepIndex];
      stepIndex++;
      if(stepIndex>=LANDOLT_LEVELS.length){
        finishTest(true);
        return; // STOP — plus de RAF
      }
      lastRafTs=null;
      spinAngle=0;
      setupStep();
      rafId=requestAnimationFrame(masterLoop);
      return; // repart proprement après setupStep
    }
  } else {
    correctHoldStart=null;
  }
 
  if(elapsed>=STEP_DURATION){
    finishTest(false);
    return; // STOP — plus de RAF
  }
 
  rafId=requestAnimationFrame(masterLoop); // un seul RAF actif
}
 
function finishTest(completed){
  if(testFinished) return; // guard double appel
  testFinished=true;
  testRunning=false;
  cancelAnimationFrame(rafId); // arrête masterLoop
 
  const finalLevel=lastGoodSize; // always use lastGoodSize (updated before finishTest call)
  const levelsReached=completed?LANDOLT_LEVELS.length:stepIndex;
 
  const distAtEnd=Math.round(estimatedDistCm);
  const avCorrFinal=parseFloat((finalLevel.av*estimatedDistCm/80).toFixed(1));
  const session={
    date:new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
    av:finalLevel.av,
    avCorr:avCorrFinal,
    dist:distAtEnd,
    levels:levelsReached,
    completed
  };
  history.unshift(session);
  if(history.length>30)history=history.slice(0,30);
  localStorage.setItem('gazeHist2',JSON.stringify(history));
 
  // Remplir la modale de résultats
  document.getElementById('rmNum').textContent=avLabel(finalLevel.av);
  document.getElementById('rmDist').textContent='à ~'+distAtEnd+' cm  ·  AV corrigée 80 cm : '+avLabel(avCorrFinal)+'/10';
  let verdict='';
  if(completed) verdict='Score parfait — tous les niveaux réussis !';
  else if(levelsReached>=10) verdict='Acuité attentionnelle excellente.';
  else if(levelsReached>=7) verdict='Bonne attraction visuelle au mouvement.';
  else if(levelsReached>=4) verdict='Attraction modérée — sensible aux grands stimuli.';
  else verdict='Faible attraction détectée.';
  document.getElementById('rmVerdict').textContent=verdict;
  // Historique dans la modale
  renderHistory();
  setTimeout(()=>document.getElementById('resultModal').classList.add('visible'), 0);
}
 
// ── CALIBRATION RÈGLE DRAGGABLE ──
(function initCalibration(){
  const ruler=document.getElementById('calRuler');
  const valTxt=document.getElementById('calValTxt');
  const rulerTxt=document.getElementById('calRulerTxt');
  const calOk=document.getElementById('calOk');
 
  // Initialiser à la valeur CSS (37.8px/cm) ou sauvegardée
  let rulerPx=PX_PER_CM*10; // pixels CSS pour 10cm selon calibration actuelle
  const MIN=80, MAX=Math.min(window.innerWidth-40, 600);
  rulerPx=Math.max(MIN,Math.min(MAX,rulerPx));
 
  function updateRuler(px){
    rulerPx=Math.max(MIN,Math.min(MAX,px));
    ruler.style.width=rulerPx+'px';
    const cm=(rulerPx/PX_PER_CM).toFixed(1); // affiche cm CSS actuels
    // Ce qu'on veut: l'utilisateur fait correspondre visuellement à 10cm réels
    rulerTxt.textContent='← 10 cm →';
    valTxt.textContent=Math.round(rulerPx)+'px';
  }
  updateRuler(rulerPx);
 
  let dragging=false, startX=0, startW=0;
 
  function onStart(e){
    dragging=true;
    startX=e.touches?e.touches[0].clientX:e.clientX;
    startW=rulerPx;
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging)return;
    const x=e.touches?e.touches[0].clientX:e.clientX;
    updateRuler(startW+(x-startX));
    e.preventDefault();
  }
  function onEnd(){
    if(!dragging)return;
    dragging=false;
    // Appliquer la calibration : rulerPx CSS = 10cm physiques
    applyCalibration(rulerPx);
    calOk.style.display='block';
    setTimeout(()=>calOk.style.display='none',2000);
  }
 
  ruler.addEventListener('mousedown',onStart);
  ruler.addEventListener('touchstart',onStart,{passive:false});
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',onEnd);
  window.addEventListener('touchend',onEnd);
})();
 
function renderHistory(){
  // Rend l'historique dans la modale résultats
  const list=document.getElementById('rmHistList');
  if(!list) return;
  if(!history.length){
    list.innerHTML='<div style="font-size:12px;color:#ccc;padding:6px 0">Aucune session précédente</div>';
    return;
  }
  list.innerHTML=history.slice(0,8).map(s=>`
    <div class="rm-h-item">
      <span style="color:var(--muted)">${s.date} · ${s.levels} niv.</span>
      <span style="font-weight:500">AV ${avLabel(s.av)}/10${s.avCorr?' (→'+s.avCorr+')':''}</span>
    </div>
  `).join('');
}
 
function goSetup(){
  testRunning=false;
  testFinished=true;
  cancelAnimationFrame(rafId);
  showScreen('sSetup');
}
 
function newTestFromModal(){
  document.getElementById('resultModal').classList.remove('visible');
  startTest();
}
 
function exportCSV(){
  const rows=[['#','Date','AV (dixièmes)','Niveaux','Complété']];
  history.forEach((s,i)=>rows.push([history.length-i,s.date,s.av,s.levels,s.completed?'oui':'non']));
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='gaze_test_'+Date.now()+'.csv';
  a.click();
}
 
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
